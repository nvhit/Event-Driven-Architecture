server.port=8080
spring.application.name=streamsocial-event-system

# Jackson configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Kafka - disabled by default (in-memory EventBus only)
# To enable Kafka: run with profile "kafka"
#   mvn spring-boot:run -Dspring-boot.run.profiles=kafka
spring.kafka.bootstrap-servers=localhost:9092

# Exclude Kafka auto-config by default (no KafkaTemplate bean created)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
