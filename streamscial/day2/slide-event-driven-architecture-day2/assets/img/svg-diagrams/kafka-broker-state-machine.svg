<svg viewBox="0 0 1050 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1050" height="780" fill="#ffffff"/>

  <!-- Tiêu đề -->
  <text x="525" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a2e">Kafka Broker State Machine- StreamSocial Cluster</text>

  <defs>
    <marker id="arrN" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#37474f"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e53935"/>
    </marker>
  </defs>

  <!-- Initial state -->
  <circle cx="70" cy="150" r="12" fill="#000"/>
  <circle cx="70" cy="150" r="18" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="70" y="185" text-anchor="middle" font-size="11" fill="#333">Initial</text>
  <line x1="88" y1="150" x2="150" y2="150" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrN)"/>
  <text x="118" y="140" text-anchor="middle" font-size="10" fill="#555">Boot Process</text>

  <!-- STARTING -->
  <ellipse cx="240" cy="150" rx="90" ry="48" fill="#c8f7c5" stroke="#2e7d32" stroke-width="2"/>
  <text x="240" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">STARTING</text>
  <text x="240" y="158" text-anchor="middle" font-size="9" fill="#1b5e20">Load cấu hình</text>
  <text x="240" y="171" text-anchor="middle" font-size="9" fill="#1b5e20">Đăng ký với Cluster</text>

  <!-- RUNNING -->
  <ellipse cx="500" cy="150" rx="90" ry="48" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="500" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">RUNNING</text>
  <text x="500" y="158" text-anchor="middle" font-size="9" fill="#0d47a1">Serving Requests</text>
  <text x="500" y="171" text-anchor="middle" font-size="9" fill="#0d47a1">Replicating Data</text>

  <line x1="330" y1="150" x2="410" y2="150" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrN)"/>
  <text x="370" y="140" text-anchor="middle" font-size="9" fill="#555">Cluster Join Thành công</text>

  <!-- LEADER ELECTION -->
  <ellipse cx="800" cy="220" rx="100" ry="50" fill="#fff3cd" stroke="#f9a825" stroke-width="2"/>
  <text x="800" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#8d6e00">BẦU LEADER</text>
  <text x="800" y="228" text-anchor="middle" font-size="9" fill="#5d4037">Quy trình voting</text>
  <text x="800" y="241" text-anchor="middle" font-size="9" fill="#5d4037">Xây dựng đồng thuận</text>

  <path d="M 585,165 C 650,190 720,205 705,215" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="640" y="180" text-anchor="middle" font-size="9" fill="#555">Controller lỗi</text>

  <path d="M 745,190 C 700,170 620,155 590,150" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="700" y="145" text-anchor="middle" font-size="9" fill="#555">Bầu leader mới</text>

  <!-- FAILED -->
  <ellipse cx="500" cy="360" rx="90" ry="48" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="500" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">FAILED</text>
  <text x="500" y="368" text-anchor="middle" font-size="9" fill="#b71c1c">Phân vùng network</text>
  <text x="500" y="381" text-anchor="middle" font-size="9" fill="#b71c1c">Lỗi Disk</text>

  <line x1="500" y1="198" x2="500" y2="312" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrN)"/>
  <text x="545" y="260" text-anchor="middle" font-size="9" fill="#555">Lỗi network/disk</text>

  <path d="M 570,340 C 650,300 700,250 720,238" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="660" y="290" text-anchor="middle" font-size="9" fill="#555">Lỗi nghiêm trọng(Fatal)</text>

  <!-- RECOVERING -->
  <ellipse cx="230" cy="360" rx="90" ry="48" fill="#fff3cd" stroke="#f9a825" stroke-width="2"/>
  <text x="230" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#8d6e00">RECOVERING</text>
  <text x="230" y="368" text-anchor="middle" font-size="9" fill="#5d4037">Đồng bộ partition</text>
  <text x="230" y="381" text-anchor="middle" font-size="9" fill="#5d4037">Bắt kịp dữ liệu, catching up</text>

  <line x1="245" y1="200" x2="475" y2="325" stroke="#e53935" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="330" y="270" text-anchor="middle" font-size="9" fill="#c62828" transform="rotate(18,330,270)">Đồng bộ lỗi</text>

  <path d="M 300,340 C 380,300 430,240 460,205" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="345" y="230" text-anchor="middle" font-size="9" fill="#555">Đồng bộ xong</text>

  <line x1="320" y1="360" x2="410" y2="360" stroke="#e53935" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="365" y="352" text-anchor="middle" font-size="9" fill="#c62828">Auto Recovery</text>
  <text x="365" y="378" text-anchor="middle" font-size="8" fill="#c62828">(Recovery thất bại)</text>

  <!-- SHUTDOWN -->
  <ellipse cx="800" cy="450" rx="90" ry="48" fill="#e0e0e0" stroke="#616161" stroke-width="2"/>
  <text x="800" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#424242">SHUTDOWN</text>
  <text x="800" y="456" text-anchor="middle" font-size="9" fill="#424242">Stop nhẹ nhàng(graceful)</text>
  <text x="800" y="469" text-anchor="middle" font-size="9" fill="#424242">Flushing(Xả) Data</text>

  <path d="M 560,385 C 640,420 720,440 715,445" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="640" y="425" text-anchor="middle" font-size="9" fill="#555">Lỗi nghiêm trọng</text>

  <path d="M 750,265 C 760,320 780,380 790,405" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#arrN)"/>
  <text x="815" y="330" text-anchor="middle" font-size="9" fill="#555">Admin Shutdown</text>

  <!-- Legend -->
  <rect x="30" y="530" width="230" height="110" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="45" y="552" font-size="13" font-weight="bold" fill="#333">Chú giải:</text>
  <line x1="45" y1="568" x2="75" y2="568" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrN)"/>
  <text x="82" y="572" font-size="10" fill="#333">Chuyển đổi bình thường</text>
  <line x1="45" y1="588" x2="75" y2="588" stroke="#e53935" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="82" y="592" font-size="10" fill="#333">Chuyển đổi lỗi</text>
  <circle cx="55" cy="608" r="6" fill="#1565c0"/>
  <text x="82" y="612" font-size="10" fill="#333">Trạng thái hoạt động</text>
  <circle cx="55" cy="626" r="6" fill="#c62828"/>
  <text x="82" y="630" font-size="10" fill="#333">Trạng thái lỗi</text>

  <!-- Concurrent Role States -->
  <rect x="290" y="530" width="230" height="110" rx="10" fill="#f3f0ff" stroke="#8e6fce" stroke-width="1.5"/>
  <text x="405" y="552" text-anchor="middle" font-size="12" font-weight="bold" fill="#5e35b1">Trạng thái Concurrent Role</text>
  <rect x="305" y="562" width="60" height="24" rx="5" fill="#bbdefb" stroke="#1565c0" stroke-width="1.2"/>
  <text x="335" y="578" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">LEADER</text>
  <rect x="375" y="562" width="70" height="24" rx="5" fill="#c8f7c5" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="410" y="578" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">FOLLOWER</text>
  <rect x="455" y="562" width="65" height="24" rx="5" fill="#e0e0e0" stroke="#616161" stroke-width="1.2"/>
  <text x="487" y="578" text-anchor="middle" font-size="9" font-weight="bold" fill="#424242">OBSERVER</text>
  <text x="405" y="602" text-anchor="middle" font-size="8" fill="#5e35b1">Mỗi broker giữ trạng thái riêng</text>
  <text x="405" y="614" text-anchor="middle" font-size="8" fill="#5e35b1">cho từng partition của topic</text>
  <text x="405" y="628" text-anchor="middle" font-size="8" fill="#5e35b1">Vai trò thay đổi theo tình trạng Cluster</text>

  <!-- Typical Transition Times -->
  <rect x="550" y="530" width="230" height="110" rx="10" fill="#fdf2ff" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="665" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b1fa2">Thời gian chuyển đổi</text>
  <text x="562" y="568" font-size="9" fill="#4a148c">• STARTING → RUNNING: 10-30 giây</text>
  <text x="562" y="583" font-size="9" fill="#4a148c">• Bầu leader: 5-15 giây</text>
  <text x="562" y="598" font-size="9" fill="#4a148c">• RECOVERING: 30-300 giây</text>
  <text x="562" y="613" font-size="9" fill="#4a148c">• SHUTDOWN nhẹ nhàng: 5-10 giây</text>
  <text x="562" y="628" font-size="9" fill="#4a148c">• Phát hiện lỗi: 10-30 giây</text>

  <!-- State Trigger Events -->
  <rect x="810" y="530" width="220" height="110" rx="10" fill="#eafaf1" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="920" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Sự kiện kích hoạt</text>
  <text x="822" y="568" font-size="9" fill="#1b5e20">• Container Docker khởi động</text>
  <text x="822" y="583" font-size="9" fill="#1b5e20">• Phát hiện phân vùng network</text>
  <text x="822" y="598" font-size="9" fill="#1b5e20">• Lỗi I/O Disk</text>
  <text x="822" y="613" font-size="9" fill="#1b5e20">• Tín hiệu SIGTERM từ Admin</text>
  <text x="822" y="628" font-size="9" fill="#1b5e20">• Ngoại lệ JVM OutOfMemory</text>
</svg>
