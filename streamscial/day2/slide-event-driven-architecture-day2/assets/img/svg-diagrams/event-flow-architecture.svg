<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="900" fill="#ffffff"/>

  <!-- Tiêu đề -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Kiến Trúc Luồng Sự Kiện StreamSocial</text>

  <defs>
    <marker id="arrDark" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#37474f"/>
    </marker>
    <marker id="arrGray2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Legend box: Event Types -->
  <rect x="30" y="70" width="200" height="120" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="45" y="92" font-size="13" font-weight="bold" fill="#333">Loại sự kiện</text>
  <circle cx="50" cy="108" r="4" fill="#2e7d32"/>
  <text x="62" y="112" font-size="11" fill="#333">user_action</text>
  <circle cx="50" cy="126" r="4" fill="#ef6c00"/>
  <text x="62" y="130" font-size="11" fill="#333">content_interaction</text>
  <circle cx="50" cy="144" r="4" fill="#1565c0"/>
  <text x="62" y="148" font-size="11" fill="#333">system_event</text>
  <line x1="44" y1="162" x2="58" y2="162" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrDark)"/>
  <text x="62" y="166" font-size="10" fill="#333">Chuyển giao có thứ tự</text>
  <circle cx="50" cy="180" r="4" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <text x="62" y="184" font-size="10" fill="#333">Luồng nhân bản</text>

  <!-- User Actions -->
  <ellipse cx="500" cy="120" rx="130" ry="45" fill="#c8f7c5" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Hành động người dùng</text>
  <text x="500" y="133" text-anchor="middle" font-size="11" fill="#1b5e20">Đăng bài, Thích, Bình luận, Chia sẻ, Theo dõi</text>

  <line x1="500" y1="165" x2="500" y2="205" stroke="#37474f" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Kafka Producer -->
  <rect x="405" y="210" width="190" height="70" rx="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="500" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Kafka Producer</text>
  <text x="500" y="258" text-anchor="middle" font-size="11" fill="#bf360c">Chuyển đổi sự kiện</text>

  <!-- dashed lines to monitoring -->
  <path d="M 595,235 C 700,220 760,240 815,255" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrGray2)"/>

  <line x1="500" y1="280" x2="500" y2="330" stroke="#37474f" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Partition Selection (diamond) -->
  <polygon points="500,335 580,385 500,435 420,385" fill="#fff3cd" stroke="#f9a825" stroke-width="2"/>
  <text x="500" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#8d6e00">Chọn Partition</text>

  <!-- Monitoring box -->
  <rect x="815" y="200" width="160" height="290" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="895" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Giám sát</text>
  <rect x="830" y="240" width="130" height="45" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="895" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">Lưu lượng</text>
  <text x="895" y="272" text-anchor="middle" font-size="9" fill="#0d47a1">Sự kiện/giây</text>

  <rect x="830" y="295" width="130" height="45" rx="6" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="895" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Độ trễ</text>
  <text x="895" y="327" text-anchor="middle" font-size="9" fill="#bf360c">Phản hồi P99</text>

  <rect x="830" y="350" width="130" height="45" rx="6" fill="#c8f7c5" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="895" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Tình trạng</text>
  <text x="895" y="382" text-anchor="middle" font-size="9" fill="#1b5e20">Trạng thái Broker</text>

  <rect x="830" y="405" width="130" height="45" rx="6" fill="#fff3cd" stroke="#f9a825" stroke-width="1.5"/>
  <text x="895" y="423" text-anchor="middle" font-size="11" font-weight="bold" fill="#8d6e00">Cảnh báo</text>
  <text x="895" y="437" text-anchor="middle" font-size="9" fill="#5d4037">Tỷ lệ lỗi</text>

  <path d="M 815,420 C 750,440 690,410 605,395" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrGray2)"/>

  <!-- Lines from diamond to 3 brokers -->
  <line x1="450" y1="415" x2="220" y2="500" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="335" y="450" text-anchor="middle" font-size="10" fill="#555">User ID % 3</text>

  <line x1="500" y1="435" x2="500" y2="500" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="540" y="465" text-anchor="middle" font-size="10" fill="#555">Key Hash</text>

  <line x1="550" y1="415" x2="780" y2="500" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="670" y="450" text-anchor="middle" font-size="10" fill="#555">Round Robin</text>

  <!-- Broker 1 -->
  <rect x="120" y="505" width="200" height="80" rx="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="220" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Broker 1</text>
  <text x="220" y="552" text-anchor="middle" font-size="10" fill="#bf360c">Partition 0,3,6...</text>
  <text x="220" y="568" text-anchor="middle" font-size="10" fill="#bf360c">Leader và Replicas</text>

  <!-- Broker 2 -->
  <rect x="400" y="505" width="200" height="80" rx="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="500" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Broker 2</text>
  <text x="500" y="552" text-anchor="middle" font-size="10" fill="#bf360c">Partition 1,4,7...</text>
  <text x="500" y="568" text-anchor="middle" font-size="10" fill="#bf360c">Leader và Replicas</text>

  <!-- Broker 3 -->
  <rect x="680" y="505" width="200" height="80" rx="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="780" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">Broker 3</text>
  <text x="780" y="552" text-anchor="middle" font-size="10" fill="#bf360c">Partition 2,5,8...</text>
  <text x="780" y="568" text-anchor="middle" font-size="10" fill="#bf360c">Leader và Replicas</text>

  <text x="500" y="605" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">Nhân bản đồng bộ (RF=3)</text>

  <!-- Arrows from brokers to consumer groups -->
  <path d="M 220,585 C 220,630 250,650 300,680" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)" fill-opacity="0"/>
  <path d="M 500,585 C 500,630 500,650 500,680" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <path d="M 780,585 C 780,630 750,650 710,680" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>

  <!-- Analytics -->
  <ellipse cx="220" cy="720" rx="115" ry="45" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="220" y="716" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Analytics</text>
  <text x="220" y="733" text-anchor="middle" font-size="10" fill="#0d47a1">Consumer Group</text>

  <!-- Notifications -->
  <ellipse cx="500" cy="720" rx="115" ry="45" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="500" y="716" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Notifications</text>
  <text x="500" y="733" text-anchor="middle" font-size="10" fill="#0d47a1">Consumer Group</text>

  <!-- Search Index -->
  <ellipse cx="780" cy="720" rx="115" ry="45" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="780" y="716" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">Search Index</text>
  <text x="780" y="733" text-anchor="middle" font-size="10" fill="#0d47a1">Consumer Group</text>

  <!-- Arrows to Real-time Processing -->
  <path d="M 280,750 C 350,800 420,810 460,815" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <line x1="500" y1="765" x2="500" y2="815" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <path d="M 720,750 C 650,800 580,810 540,815" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#arrDark)"/>

  <!-- Real-time Processing -->
  <rect x="380" y="815" width="240" height="65" rx="10" fill="#c8f7c5" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="843" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Xử lý thời gian thực</text>
  <text x="500" y="860" text-anchor="middle" font-size="10" fill="#1b5e20">Mô hình ML, Đề xuất</text>
</svg>
