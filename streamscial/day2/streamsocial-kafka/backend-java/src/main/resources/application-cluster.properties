# Profile: cluster
# Activate: mvn spring-boot:run -Dspring-boot.run.profiles=cluster
# Requires: docker-compose -f docker-compose-cluster.yml up -d
#   (the 3-broker cluster stack, NOT the single-broker docker-compose.yml)

server.port=8000

# Re-enable Kafka auto-configuration (override default exclude)
spring.autoconfigure.exclude=

# Kafka Producer - 3-broker cluster
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer - cluster consumer group
spring.kafka.consumer.group-id=streamsocial-cluster-consumers
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
